apiVersion: apps/v1
kind: Deployment
metadata:
  name: subscriber
  namespace: marine-edge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: subscriber
  template:
    metadata:
      labels:
        app: subscriber
    spec:
      containers:
        - name: subscriber
          image: marine-subscriber:2.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 8002
            - name: health
              containerPort: 8081
          volumeMounts:
            - name: config
              mountPath: /app/config/config.json
              subPath: config.json
            - name: telemetry-data
              mountPath: /app/output
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          livenessProbe:
            tcpSocket:
              port: metrics
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: marine-config
        - name: telemetry-data
          persistentVolumeClaim:
            claimName: telemetry-data
