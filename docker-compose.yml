services:

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: marine-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -p 1883 -t '$$SYS/broker/uptime' -C 1 -W 2"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  publisher:
    build:
      context: .
      dockerfile: Dockerfile.publisher
    container_name: marine-publisher
    depends_on:
      - mosquitto
    volumes:
      - publisher-data:/app/output
    restart: "no"

  subscriber:
    build:
      context: .
      dockerfile: Dockerfile.subscriber
    container_name: marine-subscriber
    depends_on:
      mosquitto:
        condition: service_healthy
    ports:
      - "8002:8002"
      - "8081:8081"
    volumes:
      - telemetry-data:/app/output
    restart: unless-stopped

  sync-agent:
    build:
      context: .
      dockerfile: Dockerfile.sync-agent
    container_name: marine-sync-agent
    depends_on:
      mosquitto:
        condition: service_healthy
      subscriber:
        condition: service_started
    ports:
      - "8003:8003"
    volumes:
      - publisher-data:/app/output
    restart: unless-stopped

volumes:
  publisher-data:
  telemetry-data:
