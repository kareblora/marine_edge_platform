apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-sync-agent
  namespace: marine-edge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloud-sync-agent
  template:
    metadata:
      labels:
        app: cloud-sync-agent
    spec:
      containers:
        - name: cloud-sync-agent
          image: marine-cloud-sync-agent:1.1
          imagePullPolicy: IfNotPresent
          env:
            - name: MARINE_CLOUD_SIMULATION
              value: "0"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: marine-edge-aws-credentials
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: marine-edge-aws-credentials
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_DEFAULT_REGION
              value: us-east-1
          ports:
            - name: metrics
              containerPort: 8004
          volumeMounts:
            - name: config
              mountPath: /app/config/config.json
              subPath: config.json
            - name: publisher-data
              mountPath: /app/output
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: marine-config
        - name: publisher-data
          persistentVolumeClaim:
            claimName: publisher-data
