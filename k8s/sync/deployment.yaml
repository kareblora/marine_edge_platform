apiVersion: apps/v1
kind: Deployment
metadata:
  name: sync-agent
  namespace: marine-edge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sync-agent
  template:
    metadata:
      labels:
        app: sync-agent
    spec:
      containers:
        - name: sync-agent
          image: marine-sync-agent:2.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 8003
          volumeMounts:
            - name: config
              mountPath: /app/config/config.json
              subPath: config.json
            - name: publisher-data
              mountPath: /app/output
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: marine-config
        - name: publisher-data
          persistentVolumeClaim:
            claimName: publisher-data
